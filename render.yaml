services:
  # ── Python ML Backend ──────────────────────────────────────────────────────
  - type: web
    name: cropsense-python
    runtime: python
    rootDir: crop recommendation/crop recommendation
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        value: AIzaSyAtiFNBKz1UFNkrdmk43cBftWkpxz8Xc3Y
      - key: AGMARKET_API_KEY
        value: 579b464db66ec23bdd0000013b043953f61f4d9b7563da59975fff9b

  # ── Node.js API Gateway + Frontend ────────────────────────────────────────
  - type: web
    name: cropsense-node
    runtime: node
    rootDir: crop recommendation/crop recommendation
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PYTHON_API_URL
        sync: false
      - key: JWT_SECRET
        value: cropsense-super-secret-jwt-key-2024-xK9mP3qR7vL2nW8
      - key: MONGO_URI
        value: mongodb+srv://admin:Chandana123@horizoncluster.iytvw65.mongodb.net/crop_recommendation_db
